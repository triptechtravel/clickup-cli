name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen-exp/experimental/cmd/oapi-codegen@latest
      - name: Generate API clients
        run: make api-gen
      - run: go test ./...
      - run: go vet ./...
      # Nothing enforced formatting, so every non-generated file had drifted.
      - name: Check formatting
        run: make fmt-check
      # The linter had never run in CI; 38 issues had accumulated by the time
      # it was first invoked. It is clean now, so it is enforced.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - name: Check docs are up to date
        run: |
          make docs
          git diff --exit-code docs/ || { echo "::error::Docs are out of date. Run 'make docs' locally and commit the result."; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen-exp/experimental/cmd/oapi-codegen@latest
      - name: Generate API clients
        run: make api-gen
      - run: go build -o /dev/null ./cmd/clickup
